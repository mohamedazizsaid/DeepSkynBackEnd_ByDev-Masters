name: Functional Tests - Backend

on:
  push:
    branches: [salim]
  pull_request:
    branches: [salim]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Jest unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run unit tests
        run: npm test -- --runInBand --ci

  e2e-tests:
    name: API E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run E2E tests
        run: npm run test:e2e -- --runInBand --ci
