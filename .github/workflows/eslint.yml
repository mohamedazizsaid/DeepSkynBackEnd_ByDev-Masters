name: Static Code Analysis (ESLint)

on:
  push:
    branches:
      - salim
      - atelier-3-eslint-static-analysis
  pull_request:
    branches:
      - salim

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint / TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static analysis
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
